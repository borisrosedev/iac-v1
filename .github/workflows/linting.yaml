name: Linting
run-name: "${{ github.actor }} is running Linting ... "
on:
    push:
        branches:
            - main
env:
    TFLINT_VERSION: 'v0.64.0'
    TF_VERSION: '1.15.6'
permissions:
    contents: read # allows repo code's reading
concurrency:
    group: linting-${{ github.ref }}
    cancel-in-progress: true
jobs:
    linting:
        runs-on: ubuntu-24.04
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                repository: "${{ github.repository }}"
                fetch-depth: 1
                fetch-tags: false
                show-progress: true

            - name: set up terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "${{ env.TF_VERSION }}"

            - name: check terraform code's format
              run: |
                make tf.fmt.check

            - name: set up tflint
              uses: terraform-linters/setup-tflint@v6
              with:
                tflint_version_file: "${{ env.TFLINT_VERSION }}"

            - name: check the terraform code's linting
              run: |
                make tflint.check
