name: Check Plan
run-name: "${{ github.actor }} is running Check Plan ... "
on:
    push:
        branches:
            - main

env:
    TFLINT_VERSION: '0.64.0'
    TF_VERSION: '1.15.6'
concurrency:
    group: check-plan-${{ github.ref }}
    cancel-in-progress: true
permissions:
    id-token: write # OIDC token demand is allowed thanks to this / it gives no WRITE's permissions whatsoever
    contents: read # allows repo code's reading
jobs:
    check_plan: ## each job turns in parallel ( no sharing files, variables ...)
        runs-on: ubuntu-24.04
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                repository: "${{ github.repository }}"
                fetch-depth: 1
                fetch-tags: false
                show-progress: true

            - name: set up terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "${{ env.TF_VERSION }}"

            - name: check terraform code's format
              run: |
                make tf.fmt.check

            - name: set up tflint
              uses: terraform-linters/setup-tflint@v6
              with:
                tflint_version: "${{ env.TFLINT_VERSION }}"

            - name: check the terraform code's linting
              run: |
                make tflint.check

            - name: open an AZ session
              uses: azure/login@v3
              with:
                    client-id: ${{ secrets.AZURE_CLIENT_ID }}
                    tenant-id: ${{ secrets.AZURE_TENANT_ID }}

            - name: make the plan
              run: |
                make tf.plan

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0

            - name: check trivy
              run: |
                make trivy.plan.check
