name: Check Plan
run-name: "${{ github.actor }} is running Check Plan ... "
on:
    push:
        branches:
            - main

env:
    TFLINT_VERSION: '0.64.0'
    TF_VERSION: '1.15.6'
    TRIVY_VERSION: 'v0.74.0'
concurrency:
    group: check-plan-${{ github.ref }}
    cancel-in-progress: true
permissions:
    id-token: write # OIDC token demand is allowed thanks to this / it gives no WRITE's permissions whatsoever
    contents: read # allows repo code's reading
jobs:
    check_plan: ## each job turns in parallel ( no sharing files, variables ...)
        runs-on: ubuntu-24.04
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                repository: "${{ github.repository }}"
                fetch-depth: 1
                fetch-tags: false
                show-progress: true

            - name: set up terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "${{ env.TF_VERSION }}"

            - name: check terraform code's format
              run: |
                make tf.fmt.check

            - name: set up tflint
              uses: terraform-linters/setup-tflint@v6
              with:
                tflint_version: "${{ env.TFLINT_VERSION }}"

            - name: check the terraform code's linting
              run: |
                make tflint.check

            - name: open an AZ session
              uses: azure/login@v3
              with:
                    client-id: ${{ secrets.AZURE_CLIENT_ID }}
                    tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                    subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: show OIDC subject
              run: |
                TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
                echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, iss, aud, repository_id, repository_owner_id}'


            - name: init terraform
              env:
                ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              run: |
                make tf.init

            - name: make the plan
              env:
                ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              run: |
                make tf.plan

            - name: set up trivy
              uses: aquasecurity/setup-trivy@v0.3.1
              with:
                version: "${{ env.TRIVY_VERSION }}"

            - name: check trivy
              run: |
                make trivy.plan.check
